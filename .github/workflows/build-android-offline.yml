name: Build Siaflow Offline APK

on:
  push:
    branches:
      - android-offline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out android-offline
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Update npm lockfile for the Android dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build bundled web assets
        run: npm run build

      - name: Generate Android Studio project
        run: npx cap add android

      - name: Configure native Android privacy and biometrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          content = p.read_text()
          if 'android.permission.USE_BIOMETRIC' not in content:
              content = content.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
          content = re.sub(r'android:allowBackup="[^"]*"', '', content)
          content = re.sub(r'android:fullBackupContent="[^"]*"', '', content)
          content = content.replace('<application', '<application android:allowBackup="false" android:fullBackupContent="false"', 1)
          p.write_text(content)
          PY

      - name: Sync native dependencies
        run: npx cap sync android

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siaflow-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
