name: Website Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Website Health
      run: |
        STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://siaflow.lovable.app/)
        if [ "$STATUS" != "200" ]; then
          echo "Website is down!"
          exit 1
        fi

  mac-offline-build:
    if: ${{ github.head_ref == 'mac-offline' || github.ref == 'refs/heads/mac-offline' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile offline Mac interface
        run: npm run mac:build
      - name: Create unsigned Mac DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.yml --mac dmg zip --arm64 --x64 --publish never
      - name: Upload Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: siaflow-mac-offline-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
