name: Website Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Website Health
      run: |
        STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://siaflow.lovable.app/)
        if [ "$STATUS" != "200" ]; then
          echo "Website is down!"
          exit 1
        fi

  android-offline-build:
    if: ${{ github.head_ref == 'android-offline' || github.ref == 'refs/heads/android-offline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Disable native Android OS backups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          text=re.sub(r'android:allowBackup="[^"]*"', '', text)
          text=re.sub(r'android:fullBackupContent="[^"]*"', '', text)
          text=text.replace('<application', '<application android:allowBackup="false" android:fullBackupContent="false"', 1)
          text=text.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
          path.write_text(text)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Compile debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: siaflow-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
